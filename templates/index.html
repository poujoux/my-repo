<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E</title>
</head>

<body>

    <h1 id="caption">n</h1>

    <form id="main" method="POST" enctype="multipart/form-data">

        <label for="efiles">Put files</label>
	<input type="file" id="efiles" name="efiles" required>

	<br><br>

        <button type="submit" id="ebutton">Upload</button>
    </form>

    <p id="message"></p>

    <script>

        const efiles = document.getElementById("efiles")
	    const message = document.getElementById("message");



        document.getElementById("main").addEventListener("submit", async (event) => {
            event.preventDefault();

            const form = new FormData(event.target);

            try {

		    const response = await fetch(`/educateit`, {
                    method: "POST",
                    body: form
                });
		const data = await response.json();
		if (!response.ok) {
		    throw new Error(data.msg || "Upload failed");
		}
		    
			    const myimg = document.createElement("img");
			    const br = document.createElement("br");
			    const br3 = document.createElement("br");
			    myimg.width = 100;
			    myimg.height = 100;
			    myimg.src = URL.createObjectURL(efiles.files[0]);
			    document.body.appendChild(br3);
			    document.body.appendChild(br);
			    document.body.appendChild(myimg);

		    //img.style.display = "none";
		    message.textContent = data.msg;
		    message.style.color = "green";


		    setTimeout(() => {
			    window.location.reload(); 
		    }, 3000);


	    } 
		catch (error) {
			console.error(error);

			message.textContent = error.message;
			message.style.color = "red";

		}         });


    </script>

</body>
</html>

    
</body>
</html>
